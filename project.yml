name: PocketPy
options:
  bundleIdPrefix: com.pockeypy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "20261028.03"
    SWIFT_VERSION: "5.9"
targets:
  PocketPy:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        type: resource
      - path: Resources/web
        type: resource
      - path: PythonEmbed/Python.framework
        type: resource
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pockeypy.ide
        PRODUCT_NAME: PocketPy
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Resources/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        ONLY_ACTIVE_ARCH: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GCC_C_LANGUAGE_STANDARD: "gnu17"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/PythonEmbed/include-python3.14 $(PROJECT_DIR)/Sources/Engine"
        FRAMEWORK_SEARCH_PATHS: "$(PROJECT_DIR)/PythonEmbed"
        OTHER_LDFLAGS: "$(PROJECT_DIR)/PythonEmbed/Python.framework/Python3"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/Engine/pyembed.h"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        DYLIB_INSTALL_NAME_DIR: "@rpath"
