name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pockeppy-build
  cancel-in-progress: true

jobs:
  # ── Job 1: 交叉编译 CPython 3.13（iOS arm64 静态嵌入件）──
  python:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 下载 CPython 3.14.0 源码
        run: |
          curl -fsSL -o cpython.tgz https://github.com/python/cpython/archive/refs/tags/v3.14.0.tar.gz
          tar xzf cpython.tgz
          cd cpython-3.14.0 && ls Makefile.pre.in configure 2>/dev/null || ls configure

      - name: 交叉编译（aarch64-apple-ios16.0）
        working-directory: cpython-3.14.0
        run: |
          brew install autoconf automake 2>/dev/null || true
          [ -f configure ] || (autoconf && ls configure)
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export IOS_SDK="$SDK"
          export CC="clang -target aarch64-apple-ios16.0 -isysroot $SDK"
          export CFLAGS="-target aarch64-apple-ios16.0 -isysroot $SDK -arch arm64"
          export LDFLAGS="-target aarch64-apple-ios16.0 -isysroot $SDK -arch arm64"
          # CPython 3.14 iOS 需要 host-triplet cpp 包装器
          cat > ./arm64-apple-ios-cpp <<'WRAPPER'
          #!/bin/sh
          exec clang -E -target aarch64-apple-ios16.0 -isysroot "$IOS_SDK" "$@"
          WRAPPER
          chmod +x ./arm64-apple-ios-cpp
          export PATH="$PWD:$PATH"
          BUILD_PY=$(command -v python3 || command -v python3.14 || command -v python3.13)
          ./configure --host=aarch64-apple-ios16.0 --build=arm64-apple-darwin \
            --enable-framework \
            --with-build-python="$BUILD_PY" \
            > configure.log 2>&1 || { tail -30 configure.log; exit 1; }
          grep -q "aarch64-apple-ios" Makefile | head -1 || head -5 Makefile
          make -j4 install DESTDIR="$GITHUB_WORKSPACE/out" > build.log 2>&1 || (tail -40 build.log; exit 1)

      - name: 收集嵌入件（framework）
        run: |
          OUT="$GITHUB_WORKSPACE/out"
          FW=$(find "$OUT" -maxdepth 2 -name 'Python3*' -type d | head -1)
          echo "framework: $FW"
          find "$FW" -maxdepth 1 | head -20
          H=$(find "$OUT" -name 'pyport.h' | head -1)
          echo "pyport.h: $H"
          # embed.zip：framework 整包（静态二进制 + stdlib .py）+ 头文件
          rm -f python-embed.zip
          cp -r "$FW" "$OUT/Python3.framework" 2>/dev/null || true
          if [ -n "$H" ]; then mkdir -p "$OUT/embed-hdrs" && cp -r "$(dirname "$H")" "$OUT/embed-hdrs/" ; fi
          cd "$OUT" && zip -qr python-embed.zip Python3.framework embed-hdrs 2>/dev/null || zip -qr python-embed.zip Python3.framework
          du -sh python-embed.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pypocket-python
          path: |
            out/python-embed.zip

  # ── Job 2: SwiftUI 壳 + 内嵌引擎 → 未签名 IPA ──
  app:
    runs-on: macos-15
    needs: python
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pypocket-python

      - name: 放置嵌入件
        run: |
          rm -rf PythonEmbed
          mkdir -p PythonEmbed
          unzip -q out/python-embed.zip -d PythonEmbed/
          ls PythonEmbed/ && find PythonEmbed -maxdepth 2 | head -15

      - name: 安装 XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 假成功守卫（.swift 引用数）
        run: |
          SWIFT_COUNT=$(grep -c '\.swift' PocketPy.xcodeproj/project.pbxproj || echo 0)
          echo "Swift refs: $SWIFT_COUNT"
          [ "$SWIFT_COUNT" -lt 30 ] && { echo "!! 文件没收全"; exit 1; }

      - name: 编译归档
        run: |
          set -o pipefail
          xcodebuild -project PocketPy.xcodeproj -scheme PocketPy \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/PocketPy.xcarchive archive > archive.log 2>&1 \
          || { tail -80 archive.log; exit 1; }
          grep -q "ARCHIVE SUCCEEDED" archive.log || { tail -40 archive.log; exit 1; }

      - name: 核验二进制特征串
        run: |
          BIN="build/PocketPy.xcarchive/Products/Applications/PocketPy.app/PocketPy"
          [ -f "$BIN" ] && echo "binary ok ($(du -h "$BIN" | cut -f1))"
          for s in "口袋 Python 工作站" "OpenAI 兼容" "CPython" "运行" "历史记录"; do
            strings -a "$BIN" | grep -qF "$s" && echo "  ✓ $s" || echo "  ✗ 缺 $s"
          done
          python3 -c "import plistlib;p=plistlib.load(open('build/PocketPy.xcarchive/Products/Applications/PocketPy.app/Info.plist','rb'));print('版本:',p['CFBundleShortVersionString'],p['CFBundleVersion'])"
          # 核验引擎文件在包内
          ls "build/PocketPy.xcarchive/Products/Applications/PocketPy.app/Python3.framework" | head -5

      - name: 打未签名 IPA
        run: |
          APP="build/PocketPy.xcarchive/Products/Applications/PocketPy.app"
          rm -rf Payload dist && mkdir -p Payload dist
          cp -R "$APP" Payload/
          cd dist && zip -qr PocketPy-unsigned.ipa ../Payload && cd ..
          du -h dist/PocketPy-unsigned.ipa
          md5sum dist/PocketPy-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: pockeppy-ipa
          path: dist/PocketPy-unsigned.ipa

      - name: 发 Release（滚动 latest）
        run: |
          VER="$(grep -o 'MARKETING_VERSION: \"[0-9.]*\"' project.yml | head -1 | grep -o '[0-9.]*')"
          TOKEN="$GITHUB_TOKEN"
          ID=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.id // empty')
          if [ -n "$ID" ]; then
            curl -s -X DELETE -H "Authorization: token $TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$ID" > /dev/null
          fi
          BODY=$(jq -n --arg t "v$VER" '{tag_name:$t, name:"PocketPy v$VER", generate_notes:true, draft:false, prerelease:true}')
          RID=$(curl -s -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" -d "$BODY" \
            https://api.github.com/repos/${{ github.repository }}/releases | jq -r '.id')
          curl -s -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RID/assets/PocketPy-unsigned.ipa" \
            --data-binary @dist/PocketPy-unsigned.ipa | jq -r '.browser_download_url // "asset upload failed"'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
