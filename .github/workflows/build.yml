name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          which xcodegen || brew install xcodegen || true

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # 假成功守卫：pbxproj 必须真的挂上全部 9 个 .swift
          SWIFT_COUNT=$(grep -c '\.swift' PocketPy.xcodeproj/project.pbxproj || echo 0)
          echo "pbxproj 引用 .swift 次数: $SWIFT_COUNT (应 >= 27 = 9文件x3)"
          if [ "$SWIFT_COUNT" -lt 27 ]; then
            echo "::error::XcodeGen 未收集全部源文件（假成功风险），中断"
            exit 1
          fi

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project PocketPy.xcodeproj -scheme PocketPy -configuration Release \
            -archivePath build/PocketPy.xcarchive archive \
            2>&1 | tee archive.log | tail -40
          if ! grep -q "ARCHIVE SUCCEEDED" archive.log; then
            echo "=== 编译错误定位 ==="
            rg -n "error:" archive.log | head -30 || true
            exit 1
          fi

      - name: Verify binary
        run: |
          APP="build/PocketPy.xcarchive/Products/Applications/PocketPy.app"
          [ -f "$APP/PocketPy" ] || { echo "app 产物缺失"; exit 1; }
          SIZE=$(stat -f%z "$APP/PocketPy")
          echo "binary size: $SIZE"
          if [ "$SIZE" -lt 2000000 ]; then echo "::error::二进制过小（<2MB，疑似空壳）"; exit 1; fi
          # 中文特征串核验
          for s in "运行历史" "编辑器" "未命名" "PocketPy"; do
            if ! strings "$APP/PocketPy" | grep -q "$s"; then
              echo "::error::缺少特征串 $s"
              exit 1
            fi
          done
          python3 - <<PY
          import plistlib
          p = plistlib.load(open("$APP/Info.plist","rb"))
          print("版本核验:", p["CFBundleShortVersionString"], p["CFBundleVersion"])
          assert p["CFBundleShortVersionString"] == "0.1.0"
          assert p["CFBundleVersion"] == "20261028.01"
          print("Info.plist 版本 ✓")
          PY

      - name: Package unsigned IPA
        run: |
          APP="build/PocketPy.xcarchive/Products/Applications/PocketPy.app"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/PocketPy.app
          cd Payload && zip -rqX ../PocketPy-unsigned.ipa . && cd ..
          ls -la PocketPy-unsigned.ipa
          md5sum PocketPy-unsigned.ipa
          mkdir -p dist && mv PocketPy-unsigned.ipa dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pockeppy-ipa
          path: dist/
